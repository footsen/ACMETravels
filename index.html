<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ACME Travels</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    #map { height: 100vh; }
    #controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    label { display: block; margin: 6px 0; }
  </style>
</head>
<body>

<div id="controls">
  <strong>Show visits by:</strong><br>
  <label><input type="checkbox" id="chris" checked> Chris (<span id="count-chris">0</span>)</label>
  <label><input type="checkbox" id="maggie" checked> Maggie (<span id="count-maggie">0</span>)</label>
  <label><input type="checkbox" id="allyson" checked> Allyson (<span id="count-allyson">0</span>)</label>
  <label><input type="checkbox" id="edward" checked> Edward (<span id="count-edward">0</span>)</label>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Your script -->
<script src="script.js"></script>

</body>
</html>
